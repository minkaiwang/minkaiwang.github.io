{% assign home_is_english = false %}
{% if page.locale == 'en-US' %}{% assign home_is_english = true %}{% endif %}
<div class="home-tools"><button class="back-to-top" type="button" aria-label="{% if home_is_english %}Back to top{% else %}返回顶部{% endif %}" title="{% if home_is_english %}Back to top{% else %}返回顶部{% endif %}">
  <i class="fas fa-arrow-up" aria-hidden="true"></i>
</button></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var backToTop = document.querySelector(".back-to-top");
  var navMenuButton = document.querySelector(".greedy-nav > button");
  var hiddenNavLinks = document.querySelector(".greedy-nav > .hidden-links");
  var pagePath = window.location.pathname.replace(/index\.html$/, "");
  var navLinks = Array.prototype.slice.call(document.querySelectorAll(".greedy-nav a[href*='#'], .research-nav a[href*='#']"));
  var localLinks = navLinks.filter(function (link) {
    var url = new URL(link.href, window.location.origin);
    return url.pathname.replace(/index\.html$/, "") === pagePath && url.hash;
  });
  var sections = localLinks.map(function (link) {
    return document.getElementById(new URL(link.href, window.location.origin).hash.slice(1));
  }).filter(function (section, index, all) {
    return section && all.indexOf(section) === index;
  });
  var sectionPositions = [];
  var navigationFrame = 0;
  var navigationNeedsMeasure = true;
  var previousActiveId = null;
  var publicationLinkPrefix = "{% if home_is_english %}Open publication: {% else %}查看论文：{% endif %}";

  document.querySelectorAll(".full-publication-list li").forEach(function (item) {
    var title = item.querySelector(".pub-list-title");
    var link = item.querySelector(".pub-list-links a");
    if (title && link) link.setAttribute("aria-label", publicationLinkPrefix + title.textContent.trim());
  });

  if (navMenuButton && hiddenNavLinks) {
    navMenuButton.addEventListener("click", function () {
      window.setTimeout(function () {
        navMenuButton.setAttribute("aria-expanded", String(!hiddenNavLinks.classList.contains("hidden")));
      }, 0);
    });
  }

  localLinks.forEach(function (link) {
    link.addEventListener("click", function (event) {
      var url = new URL(link.href, window.location.origin);
      var section = document.getElementById(url.hash.slice(1));
      if (!section) return;

      event.preventDefault();
      event.stopImmediatePropagation();

      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var sectionTop = section.getBoundingClientRect().top + window.scrollY - 82;
      window.scrollTo({ top: Math.max(0, sectionTop), behavior: reduceMotion ? "auto" : "smooth" });
      window.history.pushState(null, "", url.hash);
      section.tabIndex = -1;
      section.focus({ preventScroll: true });

      var researchNav = link.closest('.research-nav');
      if (researchNav) {
        researchNav.classList.remove('is-open');
        researchNav.querySelector('.research-nav__toggle').setAttribute('aria-expanded', 'false');
      }

      var hiddenLinks = link.closest(".hidden-links");
      if (hiddenLinks) {
        hiddenLinks.classList.add("hidden");
        if (navMenuButton) navMenuButton.setAttribute("aria-expanded", "false");
      }
    }, true);
  });

  function updatePageNavigation() {
    navigationFrame = 0;
    if (navigationNeedsMeasure) {
      sectionPositions = sections.map(function (section) { return section.getBoundingClientRect().top + window.scrollY; });
      navigationNeedsMeasure = false;
    }
    var activeId = "";
    var markerOffset = Math.max(140, Math.min(360, window.innerHeight * 0.42));
    var marker = window.scrollY + markerOffset;

    sections.forEach(function (section, index) {
      if (sectionPositions[index] <= marker) activeId = section.id;
    });

    if (sections.length && window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2) {
      activeId = sections[sections.length - 1].id;
    }

    if (activeId !== previousActiveId) {
      localLinks.forEach(function (link) {
        var linkId = new URL(link.href, window.location.origin).hash.slice(1);
        link.classList.toggle("is-active", linkId === activeId);
      });
      previousActiveId = activeId;
    }

    backToTop.classList.toggle("is-visible", window.scrollY > 700);
  }

  backToTop.addEventListener("click", function () {
    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  });

  function scheduleNavigation() {
    if (!navigationFrame) navigationFrame = requestAnimationFrame(updatePageNavigation);
  }
  function measureNavigation() {
    navigationNeedsMeasure = true;
    scheduleNavigation();
  }
  window.addEventListener("scroll", scheduleNavigation, { passive: true });
  window.addEventListener("resize", measureNavigation);
  window.addEventListener("load", measureNavigation, { once: true });
  if (document.fonts) document.fonts.ready.then(measureNavigation);
  new ResizeObserver(measureNavigation).observe(document.body);
  updatePageNavigation();
});
</script>
